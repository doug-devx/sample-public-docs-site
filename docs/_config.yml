remote_theme: just-the-docs/just-the-docs@v0.11.1
plugins:
- jekyll-remote-theme
- jemoji

title: Sample Docs Site
description: A sample documentation site using Just the Docs theme.
nav_external_links:
  - title: Issues 🚀
    url: https://github.com/doug-devx/sample-public-docs-site/issues
    hide_icon: false
    opens_in_new_tab: true

color_scheme: wider

markdown: kramdown
kramdown:
  syntax_highlighter_opts:
    # disables syntax highlighting so another highlighter like highlightjs can be used
    disable: true
